name: gold_manager
description: AVS — gold sale & purchase manager, stock and transaction ledger.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ">=0.19.0 <0.21.0"
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  file_saver: ^0.2.14
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/avs_transparent.jpeg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/avs_transparent.jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true
